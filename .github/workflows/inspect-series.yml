# One-off helper: saves Kalshi's rules for every temperature series to data/series_info.json.
name: Inspect series

on:
  push:
    branches: [main]
    paths: ["tools/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspect-series
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/inspect_series.py
      - run: python tools/probe_sources.py
        timeout-minutes: 12
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series_info.json data/source_probe.json
          git commit -m "Series rules snapshot" || exit 0
          git pull --rebase -X theirs origin main
          git push
