# Runs the AI on GitHub's servers every morning and publishes the website on GitHub Pages.
# Data (weather history, markets, the picks log, backtest results) is committed back to
# the repo so each day builds on the last.
name: Update site

# GitHub runs scheduled jobs on a best-effort basis: they can start minutes to hours late.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "results/**", "README.md"]
  schedule:
    - cron: "5 13 * * *"   # 13:05 UTC = 8:05 a.m. Eastern in winter, 9:05 in summer
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = normal update; setup = first run (downloads history, ~30-60 min); backtest = re-score cities"
        type: choice
        options: [daily, setup, backtest]
        default: daily

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # first-time setup downloads months of prices one market at a time
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main   # always start from the latest saved data, not the commit that queued the run

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Run the AI
        env:
          MODE: ${{ github.event.inputs.mode || 'daily' }}
          PYTHONUNBUFFERED: "1"
          TIME_BUDGET_MIN: "240"   # long downloads stop here and continue next run
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          if [ "$MODE" = "setup" ] || [ ! -f results/backtest.json ]; then
            python hightemp.py setup
            python hightemp.py daily --no-update
          elif [ "$MODE" = "backtest" ]; then
            python hightemp.py daily
            python hightemp.py backtest
            python hightemp.py daily --no-update
          else
            # Update data and publish; re-score cities weekly or when new cities have data
            python hightemp.py daily
            if python hightemp.py backtest --if-stale; then python hightemp.py daily --no-update; fi
          fi

      - name: Save data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results
          if ! git diff --cached --quiet; then
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main   # on conflict, keep this run's data
            git push
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
